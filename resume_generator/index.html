<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css" />

        <title>Resume Generator</title>
    </head>
    <body>
    
    <div class="container" id="cv-form">
        <h1 class="text-center my-2">Resume Generator</h1>
        <p class="text-center">____________________________</p>
        
        <div class="row">
            <!-- Personal Information Section -->
            <div class="col-md-6">
                <h3>Personal Information</h3>
                <div class="form-group">
                    <label for="namefield">Your Name</label>
                    <input type="text" id="namefield" placeholder="Enter here" class="form-control">
                </div>

                <div class="form-group mt-2">
                    <label for="contactfield">Your Contact</label>
                    <input type="text" id="contactfield" placeholder="Enter here" class="form-control">
                </div>

                <div class="form-group mt-2">
                    <label for="addressfield">Your Address</label>
                    <textarea id="addressfield" placeholder="Enter here" class="form-control" rows="7"></textarea>
                </div>

                <p class="text-secondary my-2">Important Links</p>
                <div class="form-group mt-2">
                    <label for="fbfield">Facebook</label>
                    <input type="text" id="fbfield" placeholder="Enter here" class="form-control">
                </div>
                <div class="form-group mt-2">
                    <label for="instafield">Instagram</label>
                    <input type="text" id="instafield" placeholder="Enter here" class="form-control">
                </div>
                <div class="form-group mt-2">
                    <label for="linkedfield">LinkedIn</label>
                    <input type="text" id="linkedfield" placeholder="Enter here" class="form-control">
                </div>
            </div>

            <!-- Professional Information Section -->
            <div class="col-md-6">
                <h3>Professional Information</h3>
                <div class="form-group mt-2">
                    <label for="ObjectiveField">Objective</label>
                    <textarea id="ObjectiveField" rows="4" placeholder="Enter here" class="form-control"></textarea>
                </div>

                <div class="form-group mt-2" id="we">
                    <label for="">Work Experience</label>
                    <textarea placeholder="Enter here" class="form-control weField" rows="3"></textarea>
                    <div class="container text-center mt-2" id="weAddButton">
                        <button onclick="addNewWEField()" class="btn btn-primary btn-sm">Add</button>
                    </div>
                </div>

                <div class="form-group mt-2" id="aq">
                    <label for="">Academic Qualification</label>
                    <textarea placeholder="Enter here" class="form-control eqField" rows="3"></textarea>
                    <div class="container text-center mt-2" id="aqAddButton">
                        <button onclick="addNewAQField()" class="btn btn-primary btn-sm">Add</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container text-center mt-3">
            <button onclick="generateCV()" class="btn btn-primary btn-lg">Generate CV</button>
        </div>
    </div>

    <!-- CV Template Section -->
    <div class="container" id="cv-template">
        <div class="row">
            <div class="col-md-4 text-center py-5 background">
                <img src="https://amaxfireandsecurity.co.uk/wp-content/uploads/2023/12/profile-pic-MD.jpg" alt="Profile Picture" class="img-fluid myimg"/>
                <div class="container">
                    <p id="nameT1">Sravya</p>
                    <p id="contactT">Contact</p>
                    <p id="addressT">Address</p>
                    <hr />
                    <p><a id="fbT" href="#">Facebook</a></p>
                    <p><a id="instaT" href="#">Instagram</a></p>
                    <p><a id="LinkedT" href="#">LinkedIn</a></p>
                </div>
            </div>
            <div class="col-md-8 py-5">
                <h1 id="nameT2" class="text-center" style="font-weight: 980">Sravya</h1>
                <div class="card mt-4">
                    <div class="card-header background"><h3>Objective</h3></div>
                    <div class="card-body"><p id="objectiveT"></p></div>
                </div>

                <div class="card mt-4">
                    <div class="card-header background"><h3>Work Experience</h3></div>
                    <div class="card-body"><ul id="weT"></ul></div>
                </div>

                <div class="card mt-4">
                    <div class="card-header background"><h3>Academic Qualification</h3></div>
                    <div class="card-body"><ul id="aqT"></ul></div>
                </div>

                <div class="text-center mt-3">
                    <button onclick="printCV()" class="btn background">Print CV</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
